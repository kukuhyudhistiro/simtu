<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsip Surat · SIMTU</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="arsip" data-title="Arsip Surat" data-crumb="Penyimpanan digital surat yang telah selesai">

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main">
    <header class="topbar" id="topbar"></header>

    <main class="content">
      <div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(180px,1fr))">
        <div class="stat"><div class="ic blue">📦</div><div><div class="val" id="sArsip">0</div><div class="lbl">Total Arsip</div></div></div>
        <div class="stat"><div class="ic green">📄</div><div><div class="val" id="sPdf">0</div><div class="lbl">File PDF</div></div></div>
        <div class="stat"><div class="ic purple">🏷️</div><div><div class="val" id="sJenis">0</div><div class="lbl">Jenis Surat</div></div></div>
        <div class="stat"><div class="ic orange">📅</div><div><div class="val">Okt 2026</div><div class="lbl">Periode Terakhir</div></div></div>
      </div>

      <div class="card">
        <div class="card-h">
          <h3>🗄️ Arsip Digital Surat</h3>
          <div class="spacer"></div>
          <button class="btn btn-outline btn-sm" onclick="alert('Export daftar arsip ke Excel (simulasi).')">⬇️ Export</button>
        </div>

        <div class="filters">
          <input class="input grow" id="fSearch" placeholder="🔍 Cari nomor surat / keperluan..." oninput="renderTable()">
          <select class="select" id="fJenis" onchange="renderTable()"><option value="">Semua Jenis</option></select>
          <input class="input" type="month" id="fBulan" value="2026-10" onchange="renderTable()">
          <button class="btn btn-outline btn-sm" onclick="resetFilter()">Reset</button>
        </div>

        <div class="table-wrap">
          <table class="tbl">
            <thead>
              <tr><th>Nomor Surat</th><th>Jenis</th><th>Keperluan</th><th>Tanggal Surat</th><th>Ditandatangani</th><th>File</th><th>Aksi</th></tr>
            </thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  if (!getCurrentUser()) return;
  document.getElementById('fJenis').innerHTML = '<option value="">Semua Jenis</option>' +
    LETTER_TYPES.map(t => `<option value="${t.id}">${t.nama}</option>`).join('');

  const arsip = LETTER_REQUESTS.filter(s => s.status === 'selesai');
  document.getElementById('sArsip').textContent = arsip.length;
  document.getElementById('sPdf').textContent = LETTER_REQUESTS.filter(s => s.filePdf).length;
  document.getElementById('sJenis').textContent = new Set(LETTER_REQUESTS.map(s => s.jenis)).size;

  renderTable();
});

function renderTable(){
  const q = document.getElementById('fSearch').value.toLowerCase();
  const fj = document.getElementById('fJenis').value;
  const data = LETTER_REQUESTS.filter(s => s.status === 'selesai' &&
    (!q || (s.nomorSurat||'').toLowerCase().includes(q) || s.keperluan.toLowerCase().includes(q)) &&
    (!fj || s.jenis === fj));

  const body = document.getElementById('tblBody');
  if (data.length === 0){
    body.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="ic">📦</div><h4>Belum ada arsip</h4><p>Surat yang telah selesai akan otomatis tersimpan di sini.</p></div></td></tr>`;
    return;
  }

  body.innerHTML = data.map(s => `
    <tr>
      <td><span class="mono" style="color:var(--primary);font-weight:600">${s.nomorSurat}</span></td>
      <td class="text-sm">${s.jenisNama}</td>
      <td><div style="font-weight:600">${s.keperluan}</div><div class="muted" style="font-size:11.5px">${unitName(s.unit)}</div></td>
      <td class="text-sm">${fmtDate(s.tanggalSurat)}</td>
      <td class="text-sm">${s.signedBy || '-'}</td>
      <td>${s.filePdf ? `<span class="badge badge-success">📄 PDF</span>` : `<span class="badge badge-gray">Belum ada</span>`}</td>
      <td>
        <div class="acts">
          <button class="btn btn-ghost btn-icon btn-sm" onclick="alert('Membuka ${s.filePdf || 'file'} (simulasi)')" title="Unduh">⬇️</button>
          <a class="btn btn-ghost btn-icon btn-sm" href="surat-detail.html?id=${s.id}" title="Detail">👁️</a>
        </div>
      </td>
    </tr>`).join('');
}

function resetFilter(){
  ['fSearch','fJenis'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('fBulan').value = '2026-10';
  renderTable();
}
</script>
</body>
</html>
